name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short

  dag-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build the Airflow image
        run: docker build -f Dockerfile.airflow -t sdp-airflow .

      - name: Import every DAG and run the DAG tests
        run: |
          docker run --rm \
            -v "$PWD/Dags:/opt/airflow/dags:ro" \
            -v "$PWD/scripts:/opt/airflow/scripts:ro" \
            -v "$PWD/tests:/opt/airflow/tests:ro" \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags \
            sdp-airflow \
            python -m pytest /opt/airflow/tests/dag -q
